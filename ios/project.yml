name: Even
options:
  bundleIdPrefix: com.umurburhanyavuz
  deploymentTarget:
    iOS: "18.0"
packages:
  EvenKit:
    path: ..
targets:
  Even:
    type: application
    platform: iOS
    sources:
      - EvenApp
    dependencies:
      - package: EvenKit
        product: EvenApp
      - package: EvenKit
        product: DI
      - target: EvenWidgetsExtension
        embed: true
      # Watch companion scaffold isn't installer-clean yet (watchOS widget
      # extension fails MobileInstallation's NSExtensionPrincipalClass check) —
      # unembedded until that's resolved so the iPhone app installs.
      # - target: EvenWatch
      #   embed: true
      # - target: EvenWatchWidgetsExtension
      #   embed: true
    info:
      path: EvenApp/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Google in-app OAuth callback (reversed iOS client id).
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.733777745150-gb5i361it6sghbc48qlgil58nsojniq7
        # HTTP allowances for the home-server API: localhost (simulator) is
        # covered by NSAllowsLocalNetworking; even-api.home (LAN devices)
        # needs an explicit exception until the API gets real TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            even-api.home:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSCameraUsageDescription: Even uses your camera to take a profile photo.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umurburhanyavuz.even
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 11
        DEVELOPMENT_TEAM: HGQCDF9Q7V
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: Even Development
        CODE_SIGN_ENTITLEMENTS: EvenApp/Even.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_IDENTITY: 82804E3FE7DA620D77DD8DF8AB673C650D0BC82A
          PROVISIONING_PROFILE_SPECIFIER: Even AppStore
  EvenWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - EvenWidgets
    dependencies:
      - package: EvenKit
        product: EvenCore
    info:
      path: EvenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Even
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
          - SourceSans3.ttf
          - SourceSans3-Italic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umurburhanyavuz.even.widgets
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 11
        DEVELOPMENT_TEAM: HGQCDF9Q7V
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: Even Widgets Development
        CODE_SIGN_ENTITLEMENTS: EvenWidgets/EvenWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_IDENTITY: 82804E3FE7DA620D77DD8DF8AB673C650D0BC82A
          PROVISIONING_PROFILE_SPECIFIER: Even Widgets AppStore

  EvenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EvenUITests]
    dependencies:
      - target: Even
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umuryavuz.even.uitests
        DEVELOPMENT_TEAM: C3XSV85364
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Even

  # Scaffold: regenerate with xcodegen when ready to link Watch + Watch widgets.
  EvenWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [EvenWatch]
    dependencies:
      - package: EvenKit
        product: EvenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umuryavuz.even.watchkitapp
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 11
        DEVELOPMENT_TEAM: C3XSV85364
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: watchos

  EvenWatchWidgetsExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [EvenWatchWidgets]
    dependencies:
      - package: EvenKit
        product: EvenCore
    info:
      path: EvenWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Even
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umuryavuz.even.watchkitapp.widgets
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 11
        DEVELOPMENT_TEAM: C3XSV85364
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SDKROOT: watchos

schemes:
  Even:
    build:
      targets:
        Even: all
        EvenWatch: all
        EvenWatchWidgetsExtension: all
        EvenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [EvenUITests]
